services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyraftkv-node1
    command:
      - --node-id
      - node1
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --peer
      - node2=http://node2:8000
      - --peer
      - node3=http://node3:8000
      - --data-dir
      - /data
    ports:
      - "8001:8000"
    volumes:
      - node1-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyraftkv-node2
    command:
      - --node-id
      - node2
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --peer
      - node1=http://node1:8000
      - --peer
      - node3=http://node3:8000
      - --data-dir
      - /data
    ports:
      - "8002:8000"
    volumes:
      - node2-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pyraftkv-node3
    command:
      - --node-id
      - node3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --peer
      - node1=http://node1:8000
      - --peer
      - node2=http://node2:8000
      - --data-dir
      - /data
    ports:
      - "8003:8000"
    volumes:
      - node3-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: pyraftkv-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pyraftkv-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  node1-data:
  node2-data:
  node3-data:
  prometheus-data:
  grafana-data: