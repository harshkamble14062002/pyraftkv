[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyraftkv"
version = "0.1.0"
description = "Fault-tolerant distributed key-value store built in Python"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Harsha" }
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[project.scripts]
pyraftkv-node = "pyraftkv.runtime:main"